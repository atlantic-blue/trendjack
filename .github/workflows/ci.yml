name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Typecheck, test and format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Type stripping arrived in Node 22.6 and is unflagged from 22.18.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run format:check
      - name: Test
        # The runner reports success when it finds no test files, so the counts are checked
        # rather than the exit status alone. There is one summary per workspace, so every
        # workspace must report and the total must be plausible. Node writes the marker as
        # "# pass" on 22 and as an information glyph on 24, so both are accepted and the colour
        # escapes are stripped before matching.
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
          status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          counts=$(sed 's/\x1b\[[0-9;]*m//g' test-output.txt | grep -E '^(#|.) pass [0-9]+$' | awk '{print $3}')
          workspaces=$(echo "$counts" | grep -c . || true)
          total=$(echo "$counts" | awk '{sum += $1} END {print sum + 0}')
          echo "$workspaces workspaces reported, $total tests passed."
          if [ "$workspaces" -lt 3 ]; then
            echo "Expected a summary from every workspace. A missing one means its tests never ran."
            exit 1
          fi
          if [ "$total" -lt 200 ]; then
            echo "Only $total tests ran, which is fewer than this repository has. Something was skipped."
            exit 1
          fi

  integration:
    name: Store conformance against a real DynamoDB
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Conformance
        # The same suite the in memory store passes, against the real database. A fake that is
        # looser than the real thing manufactures green, so both are held to one suite. The
        # test file refuses to run without an endpoint rather than skipping, because a skipped
        # test and a passing one are indistinguishable in a summary.
        env:
          TRENDJACK_DYNAMO_ENDPOINT: http://localhost:8000
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration-output.txt
          status=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          pass=$(sed 's/\x1b\[[0-9;]*m//g' integration-output.txt | grep -E '^(#|.) pass [0-9]+$' | awk '{print $3}' | tail -1)
          if [ -z "$pass" ] || [ "$pass" -lt 15 ]; then
            echo "Expected the whole conformance suite to run. Saw '${pass:-nothing}'."
            exit 1
          fi
          echo "$pass conformance tests passed against DynamoDB."

  image:
    name: The lambda image builds and yt-dlp runs in it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        # From the repository root, because this workspace depends on another one.
        run: docker build -f apps/poller/Dockerfile -t trendjack-poller .
      - name: Prove yt-dlp is in the image and runs
        # A build that succeeded proves the layers ran, not that the binary works. The wrong
        # architecture downloads happily and then fails with an exec error at run time.
        run: |
          version=$(docker run --rm --entrypoint /usr/local/bin/yt-dlp trendjack-poller --version)
          echo "yt-dlp ${version}"
          case "$version" in
            [0-9]*) ;;
            *) echo "yt-dlp did not report a version"; exit 1 ;;
          esac
      - name: Prove the handler loads
        # It must refuse to start without its settings rather than fail half way through a run.
        run: |
          set -o pipefail
          docker run --rm --entrypoint node trendjack-poller \
            --experimental-strip-types --disable-warning=ExperimentalWarning \
            -e "import('/var/task/apps/poller/src/handler.ts').then(async m => { try { await m.handler(); console.log('STARTED WITHOUT SETTINGS'); } catch (e) { console.log(e.name); } })" \
            | tee load.txt
          grep -q MissingSettingError load.txt
