name: Poll

on:
  schedule:
    # Three times a day. A rate needs two readings taken apart in time, so polling once would
    # mean the earliest we could see one is twenty four hours in, a third of the way through
    # the window we are trying to act inside.
    - cron: "0 6,13,20 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  # Two rounds writing at once would fight over the same readings for no gain.
  group: trendjack-poll
  cancel-in-progress: false

jobs:
  poll:
    name: Poll the panel and print the digest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade --quiet yt-dlp
          yt-dlp --version

      - name: Write the panel
        # The panel is the curation worth having, so it is not in this public repository. It
        # lives in a repository secret and is written to a file the run can read.
        env:
          PANEL: ${{ secrets.TRENDJACK_PANEL_JSON }}
        run: |
          if [ -z "$PANEL" ]; then
            echo "TRENDJACK_PANEL_JSON is not set, so there is nothing to watch."
            exit 1
          fi
          printf '%s' "$PANEL" > panel.json

      - name: Assume the role
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Poll
        env:
          TRENDJACK_PANEL: panel.json
          TRENDJACK_TABLE: ${{ vars.TRENDJACK_TABLE }}
          AWS_REGION: eu-west-1
        run: npm run poll | tee digest.txt

      - name: Keep the digest
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digest.txt
